services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filaviva
      POSTGRES_USER: filaviva
      POSTGRES_PASSWORD: filaviva
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filaviva -d filaviva"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
