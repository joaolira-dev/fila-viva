spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55433/filaviva}
    username: ${DB_USER:filaviva}
    password: ${DB_PASSWORD:filaviva}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${PORT:18080}
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
